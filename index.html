<style>
:root {
  --ink:    #0B0E1A;
  --ink-2:  #14182A;

  --turf:   #0F5132;

*,*::before,*::after{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;height:100%;background:#1a1a2e;font-family:var(--body)}
#root{height:100%}

/* Shell: center the phone frame on desktop, fill on mobile */
.app-shell{
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;padding:20px;
}
@media(max-width:430px){
  .app-shell{padding:0;align-items:stretch;}
}

/* The phone viewport */
.phone{
  width:390px;height:844px;
  position:relative;overflow:hidden;
  border-radius:48px;
  background:#F4EFE3;
  box-shadow:0 40px 80px rgba(0,0,0,0.4),0 0 0 1px rgba(255,255,255,0.08);
  flex-shrink:0;
}
@media(max-width:430px){
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none;}
}

/* Screen scroll container */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;}
.screen::-webkit-scrollbar{display:none}

/* Dynamic island */
.dynamic-island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:126px;height:37px;border-radius:24px;background:#000;z-index:50;
  pointer-events:none;
}

/* Status bar area */
.status-bar{
  position:absolute;top:0;left:0;right:0;height:54px;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 0;z-index:20;pointer-events:none;
}
.status-time{font-size:17px;font-weight:600;font-family:-apple-system,system-ui}
.status-icons{display:flex;align-items:center;gap:6px}

/* Home indicator */
.home-indicator{
  position:absolute;bottom:0;left:0;right:0;z-index:60;
  height:34px;display:flex;justify-content:center;align-items:flex-end;
  padding-bottom:8px;pointer-events:none;
}
.home-indicator-bar{
  width:139px;height:5px;border-radius:100px;
  background:rgba(0,0,0,0.2);
}

/* Design system utility classes */
.halftone{background-image:radial-gradient(circle at 50% 50%, currentColor 20%, transparent 22%);background-size:8px 8px}
.halftone-lg{background-size:14px 14px}
.stripes{background-image:repeating-linear-gradient(-45deg,currentColor 0 6px,transparent 6px 12px)}
.stripes-fine{background-image:repeating-linear-gradient(-45deg,currentColor 0 2px,transparent 2px 5px)}
.chevron-strip{
  background:
    linear-gradient(135deg,transparent 33%,currentColor 33% 66%,transparent 66%) 0 0/16px 16px,
    linear-gradient(45deg,transparent 33%,currentColor 33% 66%,transparent 66%) 0 0/16px 16px;
}
.perforation{
  background-image:radial-gradient(circle,currentColor 1.4px,transparent 1.6px);
  background-size:8px 8px;background-repeat:repeat-x;background-position:0 50%;
}
.holo-shine{
  background:
    linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,0.55) 45%,rgba(255,255,255,0) 60%),
    linear-gradient(135deg,#2D6BFF,#FF3D2E 40%,#FBC531 70%,#6B3FA0);
  background-size:200% 200%,100% 100%;
  animation:holo 3.6s linear infinite;
}
.flip-card{perspective:1000px}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.flip-card.is-flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-face.back{transform:rotateY(180deg)}
.t-display{font-family:var(--display);font-weight:400;letter-spacing:0.01em;line-height:0.95}
.t-body{font-family:var(--body)}
.t-mono{font-family:var(--mono);font-weight:500;letter-spacing:-0.02em}

@keyframes holo{0%{background-position:0% 0%,0 0}100%{background-position:200% 0%,0 0}}
@keyframes pageOpen{0%{transform:rotateY(0deg);z-index:5}100%{transform:rotateY(-170deg);z-index:1}}
@keyframes pulseRing{0%{transform:scale(0.96);opacity:.8}100%{transform:scale(1.4);opacity:0}}
@keyframes scanLine{0%{transform:translateY(0%)}50%{transform:translateY(100%)}100%{transform:translateY(0%)}}
@keyframes shineSweep{0%{transform:translateX(-120%) skewX(-15deg)}100%{transform:translateX(220%) skewX(-15deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useContext, createContext, useCallback } = React;

// ─── Navigation Context ───────────────────────────────────────
const NavCtx = createContext(null);
function useNav() { return useContext(NavCtx); }

// ─── Status Bar ──────────────────────────────────────────────
function StatusBar({ dark = false }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      position:'absolute',top:0,left:0,right:0,height:54,
      display:'flex',alignItems:'center',justifyContent:'space-between',
      padding:'16px 20px 0',zIndex:20,pointerEvents:'none',
    }}>
      <span style={{fontFamily:'-apple-system,system-ui',fontWeight:590,fontSize:17,color:c}}>9:41</span>
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
        </svg>
      </div>
    </div>
  );
}

// ─── Shared Primitives ────────────────────────────────────────
function PlayerPortrait({ name, role="FW", num, captain, star, size=1 }) {
  const initials = (name||"").split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("");
  const rc = window.FMP_DATA.ROLE_COLOR[role]||"#0F5132";
  return (
    <div style={{position:"absolute",inset:0,
      background:`radial-gradient(120% 80% at 50% 110%,${rc} 0%,${rc}cc 38%,#0B0E1A 100%)`,
      overflow:"hidden"}}>
      <div className="halftone halftone-lg" style={{position:"absolute",inset:0,color:"rgba(255,255,255,0.10)",mixBlendMode:"screen"}}/>
      <div className="t-display" style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
        fontSize:96*size,color:"rgba(255,255,255,0.95)",textShadow:"0 4px 24px rgba(0,0,0,0.35)",letterSpacing:"0.04em"}}>{initials}</div>
      <div style={{position:"absolute",left:0,right:0,bottom:0,height:"30%",background:"linear-gradient(180deg,transparent,rgba(0,0,0,0.55))"}}/>
      {num!==undefined&&<div className="t-display" style={{position:"absolute",right:8*size,bottom:6*size,fontSize:28*size,color:"#fff",lineHeight:1,opacity:0.92}}>{num}</div>}
      {captain&&<div className="t-mono" style={{position:"absolute",left:6*size,top:6*size,background:"#FBC531",color:"#0B0E1A",fontSize:9*size,padding:"2px 5px",borderRadius:3,fontWeight:700,letterSpacing:"0.1em"}}>C</div>}
      {star&&<div style={{position:"absolute",left:6*size,bottom:8*size,width:14*size,height:14*size,background:"#FBC531",clipPath:"polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)"}}/>}
    </div>
  );
}

function MissingGhost({ role, type }) {
  return (
    <div style={{position:"absolute",inset:0,background:"linear-gradient(180deg,#EAE2D0,#F4EFE3)"}}>
      <div className="halftone" style={{position:"absolute",inset:0,color:"rgba(11,14,26,0.06)"}}/>
      {type==="player"&&(
        <svg viewBox="0 0 100 100" style={{position:"absolute",inset:0,width:"100%",height:"100%"}}>
          <defs><filter id="blr"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
          <g fill="rgba(11,14,26,0.18)" filter="url(#blr)">
            <circle cx="50" cy="40" r="14"/>
            <path d="M22 100 C22 78, 38 66, 50 66 C62 66, 78 78, 78 100 Z"/>
          </g>
        </svg>
      )}
      {type==="badge"&&(
        <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{width:36,height:44,background:"rgba(11,14,26,0.16)",clipPath:"polygon(50% 0,100% 18%,100% 70%,50% 100%,0 70%,0 18%)",filter:"blur(1px)"}}/>
        </div>
      )}
      {type==="team"&&(
        <div style={{position:"absolute",inset:0}}>
          {[0,1,2,3,4].map(i=>(
            <div key={i} style={{position:"absolute",width:8,height:8,borderRadius:8,background:"rgba(11,14,26,0.16)",filter:"blur(1px)",left:`${15+i*17}%`,top:`${50+(i%2)*8}%`}}/>
          ))}
        </div>
      )}
    </div>
  );
}

function BadgeArt() {
  return (
    <div style={{position:"absolute",inset:0,background:"linear-gradient(180deg,#0055A4 0%,#0055A4 33%,#FFFFFF 33%,#FFFFFF 66%,#EF4135 66%)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div className="t-display" style={{fontSize:48,color:"#FBC531",textShadow:"2px 2px 0 #0B0E1A"}}>FFF</div>
    </div>
  );
}

function TeamArt() {
  return (
    <div style={{position:"absolute",inset:0,background:"linear-gradient(160deg,#0F5132,#1A7A4D)",overflow:"hidden"}}>
      <div className="stripes-fine" style={{position:"absolute",inset:0,color:"rgba(255,255,255,0.08)"}}/>
      <div style={{position:"absolute",left:0,right:0,bottom:0,display:"flex",justifyContent:"space-around",alignItems:"flex-end",padding:"0 6px"}}>
        {Array.from({length:6}).map((_,i)=>(
          <div key={i} style={{width:9,height:14+(i%3)*2,marginBottom:6,background:"rgba(11,14,26,0.5)",borderRadius:"4px 4px 0 0",position:"relative"}}>
            <div style={{position:"absolute",left:"50%",top:-6,transform:"translateX(-50%)",width:6,height:6,borderRadius:6,background:"rgba(11,14,26,0.5)"}}/>
          </div>
        ))}
      </div>
      <div className="t-display" style={{position:"absolute",top:8,left:8,fontSize:18,color:"#FBC531",lineHeight:1}}>FRA<br/>2026</div>
    </div>
  );
}

function StickerCard({ card, state="owned", small=false, onClick, dupeCount=0, sparkle }) {
  const W=small?86:110; const H=small?118:150;
  const role=card.role||"FW";
  const rc=window.FMP_DATA.ROLE_COLOR[role]||"#0F5132";
  const isMissing=state==="missing";
  return (
    <div onClick={onClick} style={{
      width:W,height:H,position:"relative",cursor:onClick?"pointer":"default",borderRadius:8,
      background:"#fff",
      boxShadow:isMissing?"inset 0 0 0 1.5px rgba(11,14,26,0.18)":"0 1px 0 rgba(0,0,0,0.04),0 8px 16px -8px rgba(0,0,0,0.25),inset 0 0 0 0.5px rgba(11,14,26,0.18)",
      overflow:"hidden",transform:sparkle?"translateY(-2px)":"none",transition:"transform .25s",
    }}>
      <div className="t-mono" style={{position:"absolute",top:5,left:5,zIndex:4,background:isMissing?"rgba(11,14,26,0.06)":"#0B0E1A",color:isMissing?"rgba(11,14,26,0.45)":"#F4EFE3",fontSize:8,padding:"2px 5px",borderRadius:3,fontWeight:700}}>FRA{String(card.n).padStart(2,"0")}</div>
      {dupeCount>1&&<div className="t-mono" style={{position:"absolute",top:5,right:5,zIndex:4,background:"#FBC531",color:"#0B0E1A",fontSize:8,padding:"2px 5px",borderRadius:3,fontWeight:700}}>×{dupeCount}</div>}
      <div style={{position:"absolute",top:0,left:0,right:0,height:small?78:100,background:"#EAE2D0"}}>
        {isMissing?<MissingGhost role={role} type={card.type}/>:card.type==="badge"?<BadgeArt/>:card.type==="team"?<TeamArt/>:<PlayerPortrait name={card.name} role={role} num={card.num} captain={card.captain} star={card.star} size={small?0.7:1}/>}
        {!isMissing&&<div style={{position:"absolute",inset:0,pointerEvents:"none",background:"linear-gradient(115deg,transparent 30%,rgba(255,255,255,0.15) 45%,transparent 60%)"}}/>}
      </div>
      <div style={{position:"absolute",left:0,right:0,bottom:0,height:small?40:50,padding:"5px 7px",boxSizing:"border-box",display:"flex",flexDirection:"column",justifyContent:"center",gap:1,borderTop:`2px solid ${isMissing?"rgba(11,14,26,0.12)":rc}`,background:isMissing?"rgba(244,239,227,0.5)":"#F4EFE3"}}>
        <div className="t-display" style={{fontSize:small?11:13,color:isMissing?"rgba(11,14,26,0.35)":"#0B0E1A",letterSpacing:"0.02em",lineHeight:1.05,textOverflow:"ellipsis",whiteSpace:"nowrap",overflow:"hidden"}}>
          {card.type==="badge"?"ÉCUSSON":card.type==="team"?"ÉQUIPE FRANCE":(card.name||"").toUpperCase()}
        </div>
        <div className="t-mono" style={{fontSize:small?7:8,color:isMissing?"rgba(11,14,26,0.3)":"rgba(11,14,26,0.55)",letterSpacing:"0.06em",textTransform:"uppercase"}}>
          {card.type==="player"?`${role} · ${card.caps} sél.`:card.sub||"FRANCE 2026"}
        </div>
      </div>
      {isMissing&&<div style={{position:"absolute",inset:4,borderRadius:6,border:"1.5px dashed rgba(11,14,26,0.22)",pointerEvents:"none"}}/>}
    </div>
  );
}

function FmpLogo({ size=1, dark=false }) {
  const ink=dark?"#F4EFE3":"#0B0E1A";
  return (
    <div style={{display:"flex",alignItems:"center",gap:6*size}}>
      <div style={{width:22*size,height:22*size,position:"relative",background:"#FF3D2E",borderRadius:4*size}}>
        <div style={{position:"absolute",inset:"20%",borderRadius:"50%",border:`${2*size}px solid #F4EFE3`}}/>
        <div style={{position:"absolute",left:"50%",top:"50%",width:3*size,height:3*size,background:"#F4EFE3",borderRadius:"50%",transform:"translate(-50%,-50%)"}}/>

      <div className="t-display" style={{fontSize:17*size,color:ink,letterSpacing:"0.02em",lineHeight:1}}>
        FIND<span style={{color:"#FF3D2E"}}>MY</span>PANINI

}

function FmpButton({ children, kind="fire", size="md", icon, onClick, style={} }) {
  const K={fire:{bg:"#FF3D2E",fg:"#F4EFE3"},sun:{bg:"#FBC531",fg:"#0B0E1A"},ink:{bg:"#0B0E1A",fg:"#F4EFE3"},paper:{bg:"#F4EFE3",fg:"#0B0E1A"},sky:{bg:"#2D6BFF",fg:"#F4EFE3"},turf:{bg:"#0F5132",fg:"#F4EFE3"}}[kind];
  const S={sm:{h:32,px:12,fs:12},md:{h:42,px:16,fs:14},lg:{h:52,px:22,fs:16}}[size];
  return (
    <button onClick={onClick} className="t-display" style={{height:S.h,padding:`0 ${S.px}px`,background:K.bg,color:K.fg,border:0,borderRadius:S.h/2,letterSpacing:"0.06em",fontSize:S.fs,display:"inline-flex",alignItems:"center",gap:8,cursor:"pointer",boxShadow:"0 4px 14px -6px rgba(0,0,0,0.4)",...style}}>
      {icon}{children}
    </button>
  );
}

function FmpProgress({ pct, label, sub, color="#FF3D2E", height=10 }) {
  return (
    <div>
      {(label||sub)&&(
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
          {label&&<span className="t-mono" style={{fontSize:10,letterSpacing:"0.08em",textTransform:"uppercase"}}>{label}</span>}
          {sub&&<span className="t-mono" style={{fontSize:10,opacity:0.6}}>{sub}</span>}
        </div>
      )}
      <div style={{height,borderRadius:height,background:"rgba(11,14,26,0.08)",overflow:"hidden",position:"relative"}}>
        <div style={{position:"absolute",inset:0,width:`${pct}%`,background:color,borderRadius:height}}>
          <div className="stripes-fine" style={{position:"absolute",inset:0,color:"rgba(255,255,255,0.25)",mixBlendMode:"screen"}}/>
        </div>
      </div>
    </div>
  );
}

function FlagBar({ flag, height=14, vertical=false }) {

// ─── Progress Dial ───────────────────────────────────────────
function ProgressDial({ pct }) {
  const r=36,c=2*Math.PI*r,off=c-(pct/100)*c;
  return (
    <div style={{position:"relative",width:96,height:96,flexShrink:0}}>
      <svg viewBox="0 0 100 100" width="96" height="96" style={{transform:"rotate(-90deg)"}}>
        <circle cx="50" cy="50" r={r} stroke="rgba(11,14,26,0.08)" strokeWidth="9" fill="none"/>
        <circle cx="50" cy="50" r={r} stroke="#FF3D2E" strokeWidth="9" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} fill="none"/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <div className="t-display" style={{fontSize:28,color:"#0B0E1A",lineHeight:1}}>{pct}<span style={{fontSize:14}}>%</span></div>
        <div className="t-mono" style={{fontSize:7,opacity:0.5,letterSpacing:"0.1em",marginTop:2}}>COMPLET</div>
      </div>
    </div>
  );
}

}

          {tag:"POPULAIRE",tagBg:"#FBC531",tagFg:"#0B0E1A",title:"PRO MENSUEL",price:"2,99€",sub:"par mois · sans engagement",features:["Zéro publicité","Scan illimité","Wishlist & doublons illimités","Export PDF de l'album"],cta:"ESSAYER 7 JOURS",ctaKind:"sun",highlight:true},
          {tag:"MEILLEURE OFFRE",tagBg:"#FF3D2E",tagFg:"#F4EFE3",title:"PRO COUPE DU MONDE",price:"9,99€",sub:"paiement unique · jusqu'au 19 juillet 2026",features:["Tout PRO inclus","Cartes en 3D AR","Statistiques live des matchs","Badge Mattéo & Théo"],cta:"ACHETER LE PASS",ctaKind:"fire"},
        ].map(plan=>(
          <div key={plan.title} style={{background:plan.highlight?"linear-gradient(160deg,#14182A,#1A2540)":"rgba(255,255,255,0.05)",border:plan.highlight?"1.5px solid #FBC531":"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:14,position:"relative"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <span className="t-mono" style={{background:plan.tagBg,color:plan.tagFg,fontSize:9,padding:"3px 7px",borderRadius:3,letterSpacing:"0.1em",fontWeight:700}}>{plan.tag}</span>
            </div>
            <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:4}}>
              <div className="t-display" style={{fontSize:24,color:"#F4EFE3",letterSpacing:"0.04em"}}>{plan.title}</div>
              <div className="t-display" style={{fontSize:28,color:plan.highlight?"#FBC531":"#F4EFE3",lineHeight:1}}>{plan.price}</div>
            </div>
            <div className="t-mono" style={{fontSize:9,opacity:0.6,letterSpacing:"0.06em"}}>{plan.sub}</div>
            <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
              {plan.features.map((f,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
                  <div style={{width:16,height:16,borderRadius:8,flexShrink:0,background:plan.highlight?"#FBC531":"rgba(255,255,255,0.12)",color:plan.highlight?"#0B0E1A":"#F4EFE3",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700}}>✓</div>
                  <span className="t-body" style={{opacity:0.85}}>{f}</span>
                </div>
              ))}
            </div>
            <FmpButton kind={plan.ctaKind} size="md" style={{marginTop:12,width:"100%",justifyContent:"center"}} onClick={nav.back}>{plan.cta}</FmpButton>
          </div>
        ))}
      </div>
      <div className="t-mono" style={{textAlign:"center",padding:"16px 18px 0",fontSize:9,opacity:0.5,letterSpacing:"0.06em"}}>Restauration d'achat · CGU · Confidentialité</div>
    </div>
  );
}

// ─── APP SHELL ───────────────────────────────────────────────
function App() {
  const [history, setHistory] = useState(["home"]);
  const screen = history[history.length - 1];

  const nav = {
    go: useCallback((s) => setHistory(h => [...h, s]), []),
    back: useCallback(() => setHistory(h => h.length > 1 ? h.slice(0, -1) : h), []),
  };

  const screens = {
    "home":        <ScreenHome/>,
    "teams":       <ScreenTeams/>,
    "scan":        <ScreenScan/>,
    "scan-result": <ScreenScanResult/>,
    "album":       <ScreenAlbum/>,
    "card-detail": <ScreenCardDetail/>,
    "wishlist":    <ScreenWishlist/>,
    "premium":     <ScreenPremium/>,
  };

  const isDark = ["scan","scan-result","card-detail","premium"].includes(screen);

  return (
    <NavCtx.Provider value={nav}>
      <div className="app-shell">
        <div className="phone">
          {/* Dynamic island */}
          <div style={{position:"absolute",top:11,left:"50%",transform:"translateX(-50%)",width:126,height:37,borderRadius:24,background:"#000",zIndex:50,pointerEvents:"none"}}/>
          {/* Status bar */}
          <StatusBar dark={isDark}/>
          {/* Screen */}
          <div className="screen" style={{paddingTop:0}}>
            {screens[screen] || screens["home"]}
          </div>
          {/* Home indicator */}
          <div style={{position:"absolute",bottom:0,left:0,right:0,zIndex:60,height:34,display:"flex",justifyContent:"center",alignItems:"flex-end",paddingBottom:8,pointerEvents:"none"}}>
            <div style={{width:139,height:5,borderRadius:100,background:isDark?"rgba(255,255,255,0.7)":"rgba(0,0,0,0.2)"}}/>
          </div>
        </div>
      </div>

      {/* Premium CTA hint on desktop */}
      <div style={{position:"fixed",bottom:24,right:24,zIndex:200}}>
        <button onClick={()=>nav.go("premium")} style={{background:"linear-gradient(135deg,#FF3D2E,#C0301F)",color:"#F4EFE3",border:"none",borderRadius:24,padding:"10px 18px",fontFamily:"var(--display)",fontSize:14,letterSpacing:"0.06em",cursor:"pointer",boxShadow:"0 8px 24px rgba(255,61,46,0.4)",display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:12}}>◆</span> PRO — 2,99€/mois
        </button>
      </div>
    </NavCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
