<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FindMyPanini — Design Canvas</title>
<meta name="viewport" content="width=1600, initial-scale=1">
<link rel="stylesheet" href="assets/system.css">
<style>
  body { margin: 0; background: #f0eee9; font-family: "Space Grotesk", system-ui, sans-serif; }
  .frame-wrap { display: flex; justify-content: center; align-items: flex-start; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Data + starters -->
<script src="app/data.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<!-- Components + screens -->
<script type="text/babel" src="app/components.jsx"></script>
<script type="text/babel" src="app/home.jsx"></script>
<script type="text/babel" src="app/scan.jsx"></script>
<script type="text/babel" src="app/album.jsx"></script>
<script type="text/babel" src="app/business.jsx"></script>
<script type="text/babel" src="app/roi.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    // helper to wrap a screen in an iOS frame inside a DCArtboard
    // — keep DCArtboard as a DIRECT child of DCSection (the canvas
    // filters by element type, so wrapper components are dropped).
    const phone = (screen, dark = false) => (
      <div className="frame-wrap">
        <IOSDevice width={402} height={874} dark={dark}>{screen}</IOSDevice>
      </div>
    );

    function App() {
      return (
        <DesignCanvas
          title="FindMyPanini"
          subtitle="Coupe du Monde 2026 · pour Mattéo & Théo · v0.1 — direction visuelle Stadium Energy">

          {/* ─────────────── SECTION 1 — HOME ─────────────── */}
          <DCSection
            id="home"
            title="01 · Accueil"
            subtitle="Le tableau de bord — progression, accès rapides, derniers stickers collés.">
            <DCArtboard id="home-a" label="A · Dashboard chevron + dial 43%" width={420} height={896}>
              {phone(<ScreenHome />)}
            </DCArtboard>
            <DCArtboard id="teams-list" label="B · Toutes les équipes (entrée alt)" width={420} height={896}>
              {phone(<ScreenTeams />)}
            </DCArtboard>
          </DCSection>

          {/* ─────────────── SECTION 2 — SCAN ─────────────── */}
          <DCSection
            id="scan"
            title="02 · Scanner une carte"
            subtitle="4 méthodes (caméra, photo, n° carte, recherche joueur). Viseur dynamique + brackets jaunes.">
            <DCArtboard id="scan-cam" label="A · Caméra live · scan en cours" width={420} height={896}>
              {phone(<ScreenScan />, true)}
            </DCArtboard>
            <DCArtboard id="scan-anim" label="B · Résultat — animation 3D" width={420} height={896}>
              {phone(<ScreenScanResult defaultMode="animation" />, true)}
            </DCArtboard>
            <DCArtboard id="scan-text" label="C · Résultat — résumé rapide" width={420} height={896}>
              {phone(<ScreenScanResult defaultMode="summary" />, true)}
            </DCArtboard>
          </DCSection>

          {/* ─────────────── SECTION 3 — ALBUM ÉQUIPE ─────────────── */}
          <DCSection
            id="album"
            title="03 · Album · équipe France (20 cartes)"
            subtitle="Drapeau en header, stats par poste, grille 3 colonnes. Cartes manquantes = silhouettes floues + outline pointillé.">
            <DCArtboard id="album-fr" label="A · France · 13/20 collées" width={420} height={896}>
              {phone(<ScreenAlbum />)}
            </DCArtboard>
            <DCArtboard id="album-detail" label="B · Détail · carte légende (flip 3D)" width={420} height={896}>
              {phone(<ScreenCardDetail />, true)}
            </DCArtboard>
          </DCSection>

          {/* ─────────────── SECTION 4 — CHASSE & ÉCHANGE ─────────────── */}
          <DCSection
            id="hunt"
            title="04 · Chasse & doublons"
            subtitle="Wishlist, doublons à échanger, suggestions de matches communautaires.">
            <DCArtboard id="wish" label="A · Wishlist + doublons" width={420} height={896}>
              {phone(<ScreenWishlist />)}
            </DCArtboard>
          </DCSection>

          {/* ─────────────── SECTION 5 — MONÉTISATION ─────────────── */}
          <DCSection
            id="money"
            title="05 · Monétisation"
            subtitle="Free + pub vs. Pro 2,99€/mois vs. Pass Coupe 9,99€ (one-shot). Le Pass est l'offre vedette pendant la CDM.">
            <DCArtboard id="paywall" label="A · Paywall · 3 plans" width={420} height={896}>
              {phone(<ScreenPremium />, true)}
            </DCArtboard>
          </DCSection>

          {/* ─────────────── SECTION 6 — BUSINESS / ROI ─────────────── */}
          <DCSection
            id="roi"
            title="06 · Business case"
            subtitle="Hypothèses marché FR/BE/CH, 3 scénarios revenus, coûts, point mort, recommandation.">
            <DCArtboard id="roi-sheet" label="Brief financier · 13 mois" width={720} height={1100}>
              <RoiSheet />
            </DCArtboard>
          </DCSection>

        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
